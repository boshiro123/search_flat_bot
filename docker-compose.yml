version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: search-flat-bot-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=search_flat_bot
      - POSTGRES_USER=bot_user
      - POSTGRES_PASSWORD=bot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d search_flat_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: search-flat-bot-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  search-flat-bot:
    build: .
    container_name: search-flat-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KUFAR_URL=${KUFAR_URL}
      - DOMOVITA_URL=${DOMOVITA_URL}
      - REALT_URL=${REALT_URL}
      - DATABASE_URL=postgresql://bot_user:bot_password@postgres:5432/search_flat_bot
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
  pgadmin_data:
